<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลูกโลกสถานการณ์โลก</title>
<meta name="description" content="ลูกโลก 3 มิติสรุปความขัดแย้ง เศรษฐกิจ ช่องแคบสำคัญ ราคาตลาดและทองคำ อัปเดตอัตโนมัติวันละหลายรอบ">
<meta name="theme-color" content="#0a0f17" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e9eef5" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%230f1a2b' stroke='%233ea7b8' stroke-width='4'/%3E%3Cpath d='M8 32h48M32 4c-10 8-10 48 0 56M32 4c10 8 10 48 0 56' fill='none' stroke='%238fb3d9' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0a0f17; --bg-elev:#101826; --surface:#141d2b; --surface-2:#1b2636;
  --border:#263448; --border-strong:#34465f;
  --text:#e7edf5; --text-2:#aab8cb; --muted:#7d8ea5;
  --accent:#43c6c1; --accent-ink:#06211f; --accent-soft:rgba(67,198,193,.14);
  --good:#45d48a; --warn:#f0b24a; --bad:#ff6a66; --crisis:#d33b63;
  --i1:#ffd166; --i2:#f8a44c; --i3:#f4703a; --i4:#e3453f; --i5:#c01448;
  --h-strong:#45d48a; --h-stable:#5aa9e6; --h-weak:#f0b24a; --h-crisis:#ff5c5c;
  --choke:#ffc857;
  --disaster:#c58cff; --disaster-soft:rgba(197,140,255,.16);
  --gold:#b88c22; --gold-glow:#e6b84f; --gold-soft:rgba(230,184,79,.14);
  --globe-fill:#0f1a2b; --globe-rim:#3ea7b8; --globe-dot:#8fb3d9; --globe-grid:#1f3047; --space:#060a11;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --font-body:"Noto Sans Thai","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-head:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,-apple-system,sans-serif;
  /* alert levels (GDACS / USGS PAGER) follow the theme's own scale */
  --al-red:var(--bad); --al-orange:var(--i2); --al-yellow:var(--i1); --al-green:var(--good); --al-none:var(--muted);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#e9eef5; --bg-elev:#f3f6fa; --surface:#ffffff; --surface-2:#eef2f8;
    --border:#d2dbe7; --border-strong:#b5c2d4;
    --text:#0f1826; --text-2:#3b4b61; --muted:#637791;
    --accent:#0e8c87; --accent-ink:#ffffff; --accent-soft:rgba(14,140,135,.12);
    --good:#1f9d5a; --warn:#a9700a; --bad:#d23f3a; --crisis:#a8173f;
    --i1:#d9a300; --i2:#e07a1a; --i3:#d9522a; --i4:#c22f2a; --i5:#8c0c32;
    --h-strong:#1f9d5a; --h-stable:#2f78c2; --h-weak:#b9780c; --h-crisis:#d23f3a;
    --choke:#b07d05;
    --disaster:#7637cc; --disaster-soft:rgba(118,55,204,.12);
    --gold:#8a6200; --gold-glow:#b8891c; --gold-soft:rgba(138,98,0,.12);
    --globe-fill:#d3dfee; --globe-rim:#2a8f9a; --globe-dot:#2f4f7d; --globe-grid:#bccbdd; --space:#dde5ef;
    --shadow:0 10px 30px rgba(20,40,70,.14);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#e9eef5; --bg-elev:#f3f6fa; --surface:#ffffff; --surface-2:#eef2f8;
  --border:#d2dbe7; --border-strong:#b5c2d4;
  --text:#0f1826; --text-2:#3b4b61; --muted:#637791;
  --accent:#0e8c87; --accent-ink:#ffffff; --accent-soft:rgba(14,140,135,.12);
  --good:#1f9d5a; --warn:#a9700a; --bad:#d23f3a; --crisis:#a8173f;
  --i1:#d9a300; --i2:#e07a1a; --i3:#d9522a; --i4:#c22f2a; --i5:#8c0c32;
  --h-strong:#1f9d5a; --h-stable:#2f78c2; --h-weak:#b9780c; --h-crisis:#d23f3a;
  --choke:#b07d05;
  --disaster:#7637cc; --disaster-soft:rgba(118,55,204,.12);
  --gold:#8a6200; --gold-glow:#b8891c; --gold-soft:rgba(138,98,0,.12);
  --globe-fill:#d3dfee; --globe-rim:#2a8f9a; --globe-dot:#2f4f7d; --globe-grid:#bccbdd; --space:#dde5ef;
  --shadow:0 10px 30px rgba(20,40,70,.14);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.55;overflow:hidden;-webkit-text-size-adjust:100%;overflow-wrap:anywhere;word-break:break-word}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.num{font-family:var(--font-head);font-variant-numeric:tabular-nums}

.app{height:100%;display:flex;flex-direction:column;min-width:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}

/* ---------- header ---------- */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:12px 6px;flex:0 0 auto}
.topbar h1{margin:0;font-family:var(--font-head);font-weight:600;font-size:clamp(17px,2.2vw,22px);line-height:1.3;letter-spacing:.01em}
.topbar .sub{margin:2px 0 0;color:var(--muted);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.live{display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.badge-sample{flex:0 0 auto;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent);padding:3px 9px;border-radius:999px;white-space:nowrap;margin-top:2px}
.badge-sample[hidden]{display:none}

/* ---------- main layout ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:62fr 38fr;gap:14px;padding-block:6px 10px}
.stage{position:relative;min-height:0;border-radius:14px;overflow:hidden;background:var(--space);border:1px solid var(--border);touch-action:none}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.panel{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.sheet-handle{display:none}
.tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--border);flex:0 0 auto;min-width:0}
.tab{flex:1 1 auto;min-width:0;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;padding:8px 6px 9px;color:var(--muted);font-weight:500;font-size:14px;cursor:pointer;border-radius:6px 6px 0 0}
.tab:hover{color:var(--text-2);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.panel-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px 18px;-webkit-overflow-scrolling:touch}
.view[hidden]{display:none}
.footnote{flex:0 0 auto;padding:8px 14px 10px;border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;line-height:1.45}

/* ---------- stage overlays ---------- */
.stage-ui{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;z-index:2}
.stage-ui > *{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--text-2);padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:500;cursor:pointer;line-height:1.2}
.chip .sw{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.chip[aria-pressed="false"] .sw{opacity:.35}
.chip.primary{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);margin-left:auto}
.chip.primary:hover{filter:brightness(1.08)}
.legend{position:absolute;left:10px;bottom:10px;z-index:2;background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:11.5px;color:var(--text-2);display:grid;gap:5px;max-width:min(380px,calc(100% - 20px))}
.legend-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.legend-row .lbl{color:var(--muted);min-width:66px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.ring{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;display:inline-block;flex:0 0 auto}
.dia{width:9px;height:9px;transform:rotate(45deg);display:inline-block;background:var(--choke);flex:0 0 auto}
.hint{position:absolute;right:10px;bottom:10px;z-index:2;color:var(--muted);font-size:11px;background:color-mix(in srgb,var(--surface) 70%,transparent);padding:3px 8px;border-radius:6px;pointer-events:none}
.fallback{position:absolute;inset:0;overflow:auto;padding:16px;display:none}
.fallback.on{display:block}
.fallback h3{margin:14px 0 6px;font-family:var(--font-head);font-size:14px;color:var(--text-2)}

/* ---------- content blocks ---------- */
.sec-title{margin:16px 0 8px;font-family:var(--font-head);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec-title:first-child{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 11px;min-width:0}
.tile .lbl{font-size:12px;color:var(--muted);line-height:1.35}
.tile .val{font-family:var(--font-head);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:3px;overflow-wrap:anywhere;word-break:break-word}
.tile .val.long{font-size:17px;line-height:1.3} .tile .val.xlong{font-size:14.5px;line-height:1.35}
.tile .delta{font-size:12px;color:var(--text-2);margin-top:2px;display:flex;align-items:flex-start;gap:5px;line-height:1.4}
.tile .delta .tr{font-family:var(--font-head);font-weight:600;flex:0 0 auto;margin-top:1px}
.tile .delta .tr.up{color:var(--text-2)} .tile .delta .tr.down{color:var(--text-2)} .tile .delta .tr.flat{color:var(--muted)}
.tile .src{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.tile .src a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--border-strong);overflow-wrap:normal;word-break:normal;max-width:100%}
.headline{font-family:var(--font-head);font-weight:600;font-size:16.5px;line-height:1.45;margin:0 0 8px}
.points{margin:0;padding-left:1.15em;color:var(--text-2)}
.points li{margin:4px 0}
.callout{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:9px 12px;color:var(--text);margin:8px 0}
.callout .k{font-size:11.5px;font-weight:600;letter-spacing:.05em;color:var(--accent);text-transform:uppercase;font-family:var(--font-head)}
.risks{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.risks li{display:flex;gap:8px;align-items:flex-start;color:var(--text-2)}
.risks li::before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:2px;background:var(--warn);margin-top:8px}

.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;cursor:pointer;min-width:0}
.item:hover{border-color:var(--border-strong)}
.item.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.item .nm{font-weight:600;font-size:14px;line-height:1.3}
.item .st{font-size:12px;color:var(--muted);line-height:1.35;margin-top:1px}
.item .meta{text-align:right;font-size:11.5px;color:var(--muted);white-space:nowrap}
.item .meta b{display:block;font-family:var(--font-head);font-weight:600;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.item .nums{display:flex;gap:10px;margin-top:3px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.item .nums span b{font-family:var(--font-head);font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}

/* ---------- detail card ---------- */
.detail .back{background:none;border:0;color:var(--accent);padding:0 0 8px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.detail h2{margin:0 0 6px;font-family:var(--font-head);font-weight:600;font-size:19px;line-height:1.3}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-2);background:var(--surface-2)}
.pill .dot{width:8px;height:8px}
.detail .status{color:var(--text);font-weight:500;margin:0 0 8px}
.detail p{margin:0 0 10px;color:var(--text-2)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.kv > div{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;min-width:0}
.kv .k{font-size:11.5px;color:var(--muted)}
.kv .v{font-family:var(--font-head);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.3}
.kv .v.long{font-family:var(--font-body);font-weight:500;font-size:13.5px;line-height:1.5;color:var(--text)}
.sources{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.sources a{font-size:12px;text-decoration:none;color:var(--accent);border:1px solid var(--border-strong);padding:3px 9px;border-radius:999px;background:var(--surface-2)}
.sources a:hover{border-color:var(--accent)}
.conf-high{color:var(--good)} .conf-medium{color:var(--warn)} .conf-low{color:var(--bad)}

/* ---------- live layer ---------- */
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto;vertical-align:middle;opacity:.7}
.sdot.fresh{background:var(--good);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.sdot.stale{background:var(--warn);opacity:1}
#live-flag{display:inline-flex;align-items:center;gap:5px}
.topbar .sub #counts::before,.topbar .sub #live-flag::before{content:"\00a0·\00a0";color:var(--border-strong)}
.topbar .sub{gap:0}
#counts .short{display:none}
@media (max-width:860px){ #counts .full{display:none} #counts .short{display:inline} .news li{grid-template-columns:1fr} .news .tag{justify-self:start;max-width:100%} }
#live-flag[hidden]{display:none}
.live-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.live-head .sec-title{margin:0}
.live-head .age{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.live-head .note{flex-basis:100%;font-size:11.5px;color:var(--muted)}
.live-head .note.warn{color:var(--warn)}
.live-head.is-stale .age{color:var(--warn)}
#foot-live{white-space:nowrap}
.ticker{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 8px;margin:0 -2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin;max-width:100%}
.tk{flex:0 0 auto;width:132px;scroll-snap-align:start;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;min-width:0}
.tk .tk-l{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .tk-l a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--border-strong)}
.tk .tk-v{font-family:var(--font-head);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .tk-v .u{font-size:10.5px;font-weight:500;color:var(--muted);margin-left:4px;font-family:var(--font-body)}
.tk .tk-c{font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tk .tk-c.up{color:var(--good)} .tk .tk-c.down{color:var(--bad)} .tk .tk-c.flat{color:var(--muted)}
.offline-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:10px;padding:7px 11px;margin-bottom:12px}
.live-wait{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:7px 11px}
.news{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.news li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 11px;min-width:0}
.news li.linked{cursor:pointer}
.news li.linked:hover{border-color:var(--border-strong)}
.news .nt{font-size:13.5px;line-height:1.45;font-weight:500;grid-column:1/-1}
.news .nm2{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.news .nm2 a{color:var(--accent);text-decoration:none}
.news .tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-2);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;justify-self:end}
.news .tag.hot{color:var(--accent);border-color:var(--accent)}
.news-more{margin-top:6px;background:none;border:1px solid var(--border-strong);border-radius:999px;color:var(--text-2);padding:4px 12px;font-size:12px;cursor:pointer}
.latest{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:10px;padding:8px 11px;margin:0 0 12px}
.latest .k{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--accent);text-transform:uppercase;font-family:var(--font-head);display:flex;gap:6px;align-items:center}
.latest ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.latest li{font-size:13px;line-height:1.45}
.latest li .t{color:var(--muted);font-size:11.5px;margin-left:6px;white-space:nowrap}
.latest li a{color:var(--text);text-decoration:none}
.latest li a:hover{color:var(--accent)}
@keyframes liveflash{0%{background:color-mix(in srgb,var(--accent) 32%,transparent)}100%{background:transparent}}
.flash{animation:liveflash .9s ease-out}
.news li.flash,.tk.flash{animation:liveflash 1.1s ease-out;background:var(--surface-2)}
@media (prefers-reduced-motion: reduce){ .flash,.news li.flash,.tk.flash{animation:none} }

/* ---------- disasters ---------- */
.chip .sw.tri{border-radius:0;width:11px;height:10px;background:var(--disaster);clip-path:polygon(50% 0,100% 100%,0 100%)}
.tri{width:11px;height:10px;display:inline-block;flex:0 0 auto;background:var(--disaster);clip-path:polygon(50% 0,100% 100%,0 100%)}
.tab.dz-tab[aria-selected="true"]{border-bottom-color:var(--disaster)}
.dz-ic{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.dz-ic svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.al-red{color:var(--al-red)} .al-orange{color:var(--al-orange)} .al-yellow{color:var(--al-yellow)} .al-green{color:var(--al-green)} .al-none{color:var(--al-none)}
.list.dz .item{grid-template-columns:18px minmax(0,1fr) auto;align-items:start}
.list.dz .item .dz-ic{margin-top:1px}

.dz-sum .k .cnt{color:var(--text-2);font-weight:500;letter-spacing:0}

.dz-sum li{display:flex;gap:7px;align-items:flex-start;font-size:13px;line-height:1.45}
.dz-sum li .dz-ic,.dz-sum li .dz-ic svg{width:15px;height:15px;margin-top:2px}
.dz-sum li .t{color:var(--muted);font-size:11.5px;white-space:nowrap;margin-left:2px}
.dz-sum .more{font-size:12px;color:var(--disaster);margin-top:4px;font-weight:500}

/* ---------- gold ---------- */
.chip.gold .sw{background:var(--gold-glow);box-shadow:0 0 0 3px var(--gold-soft),0 0 8px var(--gold-glow)}
.tab.gold-tab[aria-selected="true"]{border-bottom-color:var(--gold)}
.gold-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:0 0 10px}
.gold-head h2{margin:0;font-family:var(--font-head);font-weight:600;font-size:19px;line-height:1.3;display:flex;align-items:center;gap:9px}
.gold-head h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--gold-glow);box-shadow:0 0 0 3px var(--gold-soft),0 0 10px var(--gold-glow);flex:0 0 auto}
.gold-head .asof{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.4;flex:0 1 auto}
.tile.gold-main{border-color:color-mix(in srgb,var(--gold) 55%,var(--border));background:linear-gradient(180deg,var(--gold-soft),var(--surface-2))}
.tile .lbl .live-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--good);border:1px solid color-mix(in srgb,var(--good) 50%,transparent);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:1px;line-height:1.5}
.tile .lbl .live-tag[hidden]{display:none}
.chart-wrap{position:relative;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 8px 6px;margin:8px 0 4px;min-width:0}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart-title{display:flex;justify-content:space-between;gap:4px 10px;align-items:baseline;padding:0 4px 6px;font-size:12.5px;color:var(--text-2);font-weight:500;flex-wrap:wrap}
.chart-title .note{font-size:11px;color:var(--muted);font-weight:400}
.chart-legend{display:flex;gap:6px 12px;flex-wrap:wrap;padding:6px 4px 2px;font-size:11.5px;color:var(--text-2)}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{width:14px;height:0;border-top:2px solid var(--gold);display:inline-block}
.chart-legend i.dash{border-top:1px dashed var(--muted)}
.chart-legend i.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--gold);background:var(--surface-2)}
.chart-legend i.dot.fill{background:var(--gold)}
.chart-legend i.bar{border-top:2px solid var(--border-strong)}
.chart-wrap .ax{font-family:var(--font-head);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart-wrap .axm{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.chart-wrap .grid{stroke:var(--border);stroke-width:1;shape-rendering:crispEdges}
.chart-wrap .ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart-wrap .reft{font-family:var(--font-body);font-size:10.5px;fill:var(--muted)}
.chart-wrap .ln{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart-wrap .area{fill:var(--gold);opacity:.1}
.chart-wrap .mk{fill:var(--gold);stroke:var(--surface-2);stroke-width:2}
.chart-wrap .mk.peak{fill:var(--surface-2);stroke:var(--gold);stroke-width:2}
.chart-wrap .lead{stroke:var(--gold);stroke-width:1;stroke-dasharray:2 3;opacity:.8}
.chart-wrap .lab,.chart-wrap .lab2,.chart-wrap .reft{paint-order:stroke;stroke:var(--surface-2);stroke-width:3px;stroke-linejoin:round}
.chart-wrap .lab{font-family:var(--font-head);font-size:11.5px;font-weight:600;fill:var(--text);font-variant-numeric:tabular-nums}
.chart-wrap .lab2{font-family:var(--font-body);font-size:10.5px;font-weight:500;fill:var(--text-2)}
.chart-wrap .cross{stroke:var(--text-2);stroke-width:1;opacity:.7}
.chart-wrap .hov{fill:var(--gold);stroke:var(--text);stroke-width:2}
.chart-wrap .db-line{stroke:var(--border-strong);stroke-width:2;stroke-linecap:round}
.chart-wrap .db-now{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart-wrap .nm{font-family:var(--font-body);font-size:12px;font-weight:500;fill:var(--text)}
.chart-wrap .nm2{font-family:var(--font-body);font-size:10.5px;fill:var(--muted)}
.chart-tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:5px 8px;font-size:11.5px;color:var(--text-2);box-shadow:var(--shadow);white-space:nowrap;z-index:3;line-height:1.4}
.chart-tip b{font-family:var(--font-head);color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
.chart-tip[hidden]{display:none}
details.fold{border:1px solid var(--border);border-radius:10px;background:var(--surface-2);margin:8px 0;min-width:0}
details.fold summary{list-style:none;cursor:pointer;padding:9px 12px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.35}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";font-family:var(--font-head);color:var(--muted);font-size:18px;line-height:1;flex:0 0 auto}
details.fold[open] summary::after{content:"−"}
details.fold .fold-body{padding:0 12px 11px;color:var(--text-2);font-size:13.5px;min-width:0}
details.fold .fold-body > :first-child{margin-top:0}
details.fold .fold-body p{margin:0 0 8px}
.lv-wrap{overflow-x:auto;max-width:100%}
.lv-table{width:100%;border-collapse:collapse;font-size:13px}
.lv-table th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.03em;padding:4px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
.lv-table td{padding:6px 6px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text-2);line-height:1.4}
.lv-table tr:last-child td{border-bottom:0}
.lv-table td.n{font-family:var(--font-head);font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.lv-tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-2);white-space:nowrap}
.lv-tag.res{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.lv-tag.sup{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.lv-tag.now{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.sent{display:grid;gap:6px;margin:4px 0 12px}
.sent-row{display:grid;grid-template-columns:62px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:12.5px}
.sent-l{color:var(--muted)}
.sent-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden}
.sent-fill{display:block;height:100%;border-radius:4px}
.sent-fill.bad{background:var(--bad)} .sent-fill.good{background:var(--good)} .sent-fill.muted{background:var(--muted)}
.sent-v{font-family:var(--font-head);font-weight:600;text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.scen{display:grid;gap:8px;margin:0 0 10px}
.scen > div{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 11px}
.scen .k{font-size:11.5px;font-weight:600;color:var(--gold);font-family:var(--font-head);letter-spacing:.03em}
.risks.up li::before{background:var(--good)} .risks.down li::before{background:var(--bad)}
.gold-foot{margin-top:14px;padding-top:10px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);line-height:1.5}
.gold-foot b{color:var(--text-2);font-weight:600}
@media (max-width:860px){ .tabs .tab{font-size:13.5px;padding:8px 4px 9px} }
@media (max-width:430px){ .tabs{gap:2px;padding-inline:4px} .tabs .tab{font-size:13px;padding:8px 2px 9px} }

/* ---------- mobile ---------- */
@media (max-width:860px){
  body{font-size:14.5px}
  .topbar{padding-block:10px 6px;min-width:0}
  .topbar > div{min-width:0}
  .topbar .sub{font-size:11.5px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;gap:6px;display:block}
  .topbar .sub .live::before{margin-right:2px}
  .main{display:block;position:relative;--sheet-h:50%}
  .stage{position:absolute;left:0;right:0;top:0;height:max(50%,calc(100% - var(--sheet-h)));border-radius:14px 14px 10px 10px}
  .panel{position:absolute;left:0;right:0;bottom:0;height:var(--sheet-h);border-radius:16px 16px 12px 12px;transition:height .26s cubic-bezier(.2,.8,.2,1)}
  .panel.dragging{transition:none}
  .sheet-handle{display:flex;justify-content:center;padding:8px 0 2px;cursor:grab;touch-action:none;flex:0 0 auto}
  .sheet-handle span{width:40px;height:4px;border-radius:2px;background:var(--border-strong)}
  .tabs{padding-top:2px}
  .legend{display:none}
  .hint{display:none}
  .stage-ui{left:8px;top:8px;right:8px}
  .chip{padding:4px 9px;font-size:12px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel-body{padding:12px 12px 16px}
}
@media (max-width:360px){ .tiles{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ .panel{transition:none} }

รมาส 3 ลดลง 52% จากปีก่อน เพราะกาซาและอิหร่านอยู่ในช่วงหยุดยิง สมรภูมิที่ตายมากสุดยังเป็นยูเครน (94,685 ใน 12 เดือน) ซูดาน และไนจีเรีย","สหรัฐสวมสองบทพร้อมกัน เป็นคู่สงคราม (อิหร่าน อิรัก เวเนซุเอลา) และคนกลาง (ยูเครน กาซา เลบานอน คองโก ไทย–กัมพูชา) จุดเปลี่ยนใกล้สุดคือเลือกตั้งกลางเทอม 3 พ.ย. 2026 ที่จะชี้ว่าจะเปิดฉากอิหร่านรอบใหม่หรือฟื้นข้อตกลงผ่านกาตาร์ และกำหนดทิศทางภาษี Section 301 กับการพักรบการค้าสหรัฐ–จีนที่หมดอายุ 10 ม.ค. 2027","หนี้สาธารณะโลกสูงสุดตั้งแต่สงครามโลกครั้งที่ 2 สหรัฐ $40.55 ล้านล้าน ยีลด์อังกฤษสูงสุดตั้งแต่ 2007 IMF เรียกร้องให้สร้างพื้นที่การคลังใหม่และใช้เงินช่วยค่าครองชีพแบบเจาะจงแทนการตรึงราคาพลังงาน ซึ่งเป็นแรงกดดันตรงต่อกองทุนน้ำมันของไทยที่ติดลบราว 1 แสนล้านบาท"],"thailand":"ไทยอยู่ฝั่ง ‘โตต่ำ’ ของโลกสองความเร็ว IMF คาด 2.1% ช้ากว่าอาเซียนแทบทุกประเทศ แต่ ธปท. มองดีกว่าที่ 2.4% จากส่งออกที่โตเดือนที่ 27 ติดต่อกัน (+24% ก.ย.) ด้วยแรงหนุนสินค้าเกี่ยวกับ AI ขณะที่ท่องเที่ยวหดตัว (-3.65%) หนี้ครัวเรือน 85% ของ GDP และ NPL SME ~10% ฉุดการบริโภค กนง. คงดอกเบี้ย 1.00% สวนทางโลกที่ขึ้น ทำให้บาทอ่อน ~7% และเริ่มส่งสัญญาณว่าดอกเบี้ยต่ำนานมีต้นทุน ความเสี่ยงเฉพาะหน้าคือเงินเฟ้อไตรมาส 4 อาจเกิน 3% จากน้ำมันผ่านฮอร์มุซ ภาษีสหรัฐเปลี่ยนจาก 19% เป็น Section 301 12.5% โดยข้อตกลงการค้ายังไม่ลงนาม ชายแดนกัมพูชาสงบแต่ข้อพิพาทไม่จบ และการเมืองในประเทศ (ญัตติไม่ไว้วางใจ น้ำท่วม ประท้วงหนี้) เพิ่มความไม่แน่นอน","risks":["สงครามอิหร่านรอบใหม่หลัง 3 พ.ย. หรือฮอร์มุซไม่เปิดตามสมมติฐาน IMF (มี.ค. 2027) จะทำให้คาดการณ์ฟื้นตัวปี 2027 ที่ 3.4% ล้มทั้งกระดาน และสต็อกพลังงานที่ IEA ปล่อยไป 400 ล้านบาร์เรลใกล้หมดแรงพยุง","ฟองสบู่ AI แฟบ: capex เกินกระแสเงินสด หนี้ hyperscaler ~$800 พันล้าน หากกำไรผิดหวังต่อเนื่องจะลามถึงตลาดหุ้น การลงทุน และผู้ส่งออกชิ้นส่วนอย่างเกาหลี ไต้หวัน เวียดนาม และไทย","วิกฤตการคลังในประเทศพัฒนาแล้ว (ฝรั่งเศส อังกฤษ สหรัฐ) ดัน term premium และต้นทุนกู้ยืมทั่วโลก ซ้ำเติมประเทศเกิดใหม่ที่ค่าเงินอ่อน (อินโดนีเซีย ตุรกี บราซิล ไทย)","สงครามลามเป็นระหว่างรัฐเพิ่ม: เอธิโอเปีย–เอริเทรีย ซาอุดีฯ บุกเยเมนภาคพื้น ปากีสถาน–อัฟกานิสถาน หรือจีนกดดันไต้หวันขณะสหรัฐติดพันตะวันออกกลาง"]}}</script>

<script>
(function(){
'use strict';

/* ================= data & helpers ================= */
var DATA = JSON.parse(document.getElementById('world-data').textContent);
var LAND = JSON.parse(document.getElementById('land-dots').textContent);
var $ = function(id){ return document.getElementById(id); };
var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thaiDate(iso){
  if(!iso) return '—';
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if(!m) return iso;
  return (+m[3]) + ' ' + TH_MONTHS[(+m[2])-1] + ' ' + ((+m[1]) + 543);
}
function domain(url){
  try { return new URL(url).hostname.replace(/^www\./,''); } catch(e){ return url; }
}
function pct(v){ return (v==null||v==='') ? '—' : ((v>0?'+':'') + Number(v).toFixed(1) + '%'); }
function num(v, unit){ return (v==null||v==='') ? '—' : (Number(v).toFixed(2).replace(/\.?0+$/,'') + (unit||'')); }

var TYPE_TH = {interstate:'สงครามระหว่างรัฐ', civil:'สงครามกลางเมือง', insurgency:'ก่อความไม่สงบ', tension:'ตึงเครียด', ceasefire:'หยุดยิง'};
var HEALTH_TH = {strong:'แข็งแรง', stable:'ทรงตัว', weak:'อ่อนแอ', crisis:'วิกฤต'};
var CONF_TH = {high:'ความเชื่อมั่นสูง', medium:'ความเชื่อมั่นปานกลาง', low:'ความเชื่อมั่นต่ำ'};
var LEVEL_TH = {1:'เฝ้าระวัง', 2:'เสี่ยง', 3:'วิกฤต'};
var TREND_GLYPH = {up:'▲', down:'▼', flat:'■'};

function h(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='text') e.textContent = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k]!=null) e.setAttribute(k, attrs[k]);
  }
  if(children) children.forEach(function(c){ if(c==null) return; e.appendChild(typeof c==='string' ? document.createTextNode(c) : c); });
  return e;
}
function sourcesList(arr){
  var ul = h('ul', {class:'sources'});
  (arr||[]).forEach(function(u){
    ul.appendChild(h('li', null, [h('a', {href:u, target:'_blank', rel:'noopener noreferrer', text:domain(u)})]));
  });
  return ul;
}
function intensityVar(i){ return 'var(--i' + Math.max(1, Math.min(5, i|0)) + ')'; }
function healthVar(hh){ return 'var(--h-' + (HEALTH_TH[hh] ? hh : 'stable') + ')'; }

var conflicts = (DATA.conflicts||[]).slice().sort(function(a,b){ return (b.intensity||0)-(a.intensity||0); });
var economies = (DATA.economies||[]).slice();
var chokepoints = (DATA.chokepoints||[]).slice();
var disasters = [];   /* live: data/disasters.json (updater/disasters.py, GDACS + USGS) */

/* ================= header ================= */
$('title').textContent = (DATA.meta && DATA.meta.title) || 'สถานการณ์โลก';
$('updated').textContent = 'อัปเดต ' + thaiDate(DATA.meta && DATA.meta.updated);
var COUNTS_FULL = conflicts.length + ' ความขัดแย้ง · ' + economies.length + ' เศรษฐกิจ · ' + chokepoints.length + ' ช่องแคบ';
$('counts').querySelector('.full').textContent = COUNTS_FULL;
$('counts').querySelector('.short').textContent = conflicts.length + ' ขัดแย้ง · ' + economies.length + ' ศก. · ' + chokepoints.length + ' ช่องแคบ';
if(DATA.meta && DATA.meta.sample === true) $('sample-badge').hidden = false;

/* ================= legend ================= */
function buildLegend(){
  var wrap = h('div', {class:'legend-body'});
  var r1 = h('div', {class:'legend-row'}, [h('span', {class:'lbl', text:'ความรุนแรง'})]);
  for(var i=1;i<=5;i++){ r1.appendChild(h('span', {class:'dot', style:'background:'+intensityVar(i), title:'ระดับ '+i})); }
  r1.appendChild(h('span', {text:'1 → 5'}));
  var r2 = h('div', {class:'legend-row'}, [h('span', {class:'lbl', text:'เศรษฐกิจ'})]);
  ['strong','stable','weak','crisis'].forEach(function(k){
    r2.appendChild(h('span', {class:'ring', style:'color:'+healthVar(k)}));
    r2.appendChild(h('span', {text:HEALTH_TH[k], style:'margin-right:4px'}));
  });
  var r3 = h('div', {class:'legend-row'}, [h('span', {class:'lbl', text:'ช่องแคบ'}), h('span', {class:'dia'}), h('span', {text:'จุดเสี่ยงเส้นทางการค้า (ใหญ่ = เสี่ยงมาก)'})]);
  var r4 = h('div', {class:'legend-row'}, [h('span', {class:'lbl', text:'ภัยพิบัติ'}), h('span', {class:'tri'}), h('span', {text:'เตือนจาก GDACS / USGS (ใหญ่ = เตือนสูง)'})]);
  wrap.appendChild(r1); wrap.appendChild(r4); wrap.appendChild(r2); wrap.appendChild(r3);
  return wrap;

var SNAPS = {low:0.30, mid:0.50, high:0.90};
var sheetState = 'mid';
function isMobile(){ return window.matchMedia('(max-width: 860px)').matches; }
function setSheet(state){
  sheetState = state;
  $('main').style.setProperty('--sheet-h', (SNAPS[state]*100)+'%');
}
(function initSheet(){
  var handle = $('sheet-handle'), panel = $('panel'), main = $('main');
  var startY = 0, startH = 0, dragging = false;
  handle.addEventListener('pointerdown', function(ev){
    dragging = true; startY = ev.clientY; startH = panel.getBoundingClientRect().height;
    panel.classList.add('dragging'); handle.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  handle.addEventListener('pointermove', function(ev){
    if(!dragging) return;
    var H = main.getBoundingClientRect().height;
    var nh = Math.max(H*0.22, Math.min(H*0.94, startH + (startY - ev.clientY)));
    main.style.setProperty('--sheet-h', nh + 'px');
  });
  function end(ev){
    if(!dragging) return; dragging = false; panel.classList.remove('dragging');
    var H = main.getBoundingClientRect().height, frac = panel.getBoundingClientRect().height / H, best = 'mid', bd = 9;
    for(var k in SNAPS){ var d = Math.abs(SNAPS[k]-frac); if(d<bd){ bd=d; best=k; } }
    setSheet(best);
  }
  handle.addEventListener('pointerup', end); handle.addEventListener('pointercancel', end);
  handle.addEventListener('click', function(){ if(!dragging) setSheet(sheetState==='high' ? 'mid' : sheetState==='mid' ? 'low' : 'mid'); });
})();

function createGlobe(stage){
  var T = THREE;
  var R = 1;
  var DEG = Math.PI/180;
  function toVec(lat, lon, r, out){
    var la = lat*DEG, lo = lon*DEG, c = Math.cos(la);
    out.set(r*c*Math.sin(lo), r*Math.sin(la), r*c*Math.cos(lo));
    return out;
  }

  var renderer = new T.WebGLRenderer({antialias:true, alpha:false, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  stage.insertBefore(renderer.domElement, stage.firstChild);
  var scene = new T.Scene();
  var camera = new T.PerspectiveCamera(40, 1, 0.1, 50);

  /* --- globe body (fresnel) --- */
  var tok = readTokens();
  var bodyMat = new T.ShaderMaterial({
    uniforms:{ uFill:{value:new T.Color(tok.fill)}, uRim:{value:new T.Color(tok.rim)} },
    vertexShader:'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }',
    fragmentShader:'uniform vec3 uFill; uniform vec3 uRim; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1.0-max(dot(vN,vV),0.0), 3.0); vec3 c = mix(uFill, uRim, f*0.85); gl_FragColor = vec4(c,1.0); }'
  });
  var body = new T.Mesh(new T.SphereGeometry(R, 64, 48), bodyMat);
  scene.add(body);

  var atmoMat = new T.ShaderMaterial({
    uniforms:{ uRim:{value:new T.Color(tok.rim)} }, side:T.BackSide, transparent:true, depthWrite:false,
    vertexShader:'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }',
    fragmentShader:'uniform vec3 uRim; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(max(dot(vN,vV),0.0), 2.2); gl_FragColor = vec4(uRim, f*0.55); }'
  });
  scene.add(new T.Mesh(new T.SphereGeometry(R*1.07, 48, 32), atmoMat));

  /* --- graticule --- */
  (function(){
    var pts = [], v = new T.Vector3(), i, j;
    for(i=-60;i<=60;i+=30){ for(j=0;j<360;j+=4){ toVec(i,j,R*1.002,v); pts.push(v.x,v.y,v.z); toVec(i,j+4,R*1.002,v); pts.push(v.x,v.y,v.z); } }
    for(j=0;j<360;j+=30){ for(i=-88;i<88;i+=4){ toVec(i,j,R*1.002,v); pts.push(v.x,v.y,v.z); toVec(i+4,j,R*1.002,v); pts.push(v.x,v.y,v.z); } }
    var g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(pts, 3));
    var m = new T.LineBasicMaterial({color:new T.Color(tok.grid), transparent:true, opacity:0.55});
    scene.add(new T.LineSegments(g, m));
    scene.userData.gridMat = m;
  })();

  /* --- land dots --- */
  var landMat = new T.ShaderMaterial({
    uniforms:{ uColor:{value:new T.Color(tok.dot)}, uPR:{value:renderer.getPixelRatio()}, uSize:{value:1.7} },
    transparent:true, depthWrite:false,
    vertexShader:'uniform float uPR; uniform float uSize; varying float vF; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vec3 n = normalize(normalMatrix*normal); vF = max(dot(n, normalize(-mv.xyz)),0.0); gl_Position = projectionMatrix*mv; gl_PointSize = uSize*uPR*(3.4/(-mv.z)); }',
    fragmentShader:'uniform vec3 uColor; varying float vF; void main(){ vec2 d = gl_PointCoord-0.5; if(dot(d,d)>0.25) discard; float a = 0.35+0.65*smoothstep(0.0,0.35,vF); gl_FragColor = vec4(uColor, a); }'
  });
  (function(){
    var n = LAND.length, pos = new Float32Array(n*3), nor = new Float32Array(n*3), v = new T.Vector3();
    for(var i=0;i<n;i++){ toVec(LAND[i][0], LAND[i][1], R*1.004, v); pos[i*3]=v.x; pos[i*3+1]=v.y; pos[i*3+2]=v.z; v.normalize(); nor[i*3]=v.x; nor[i*3+1]=v.y; nor[i*3+2]=v.z; }
    var g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(pos,3)); g.setAttribute('normal', new T.BufferAttribute(nor,3));
    scene.add(new T.Points(g, landMat));
  })();

  /* --- pins: one Points per category --- */
  var PIN_VS = 'attribute vec3 aColor; attribute float aSize; attribute float aPhase; attribute float aHot; uniform float uPR; varying vec3 vColor; varying float vPhase; varying float vFace; varying float vHot; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vec3 n = normalize(normalMatrix*normalize(position)); vFace = dot(n, normalize(-mv.xyz)); vColor = aColor; vPhase = aPhase; vHot = aHot; gl_Position = projectionMatrix*mv; gl_PointSize = aSize*uPR*(3.0/(-mv.z)); }';
  var PIN_FS = 'uniform float uTime; uniform float uPulse; uniform int uShape; varying vec3 vColor; varying float vPhase; varying float vFace; varying float vHot;'+
   'void main(){ float face = smoothstep(0.02, 0.22, vFace); if(face<0.01) discard; vec2 d=(gl_PointCoord-0.5)*2.0; float r=length(d); float a=0.0; vec3 col=vColor;'+
   ' if(uShape==0){ float core=1.0-smoothstep(0.18,0.26,r); float glow=exp(-r*r*5.0)*0.5; float t=fract(uTime*(0.45+0.35*vHot)+vPhase); float ring=(1.0-smoothstep(0.0,0.07,abs(r-(0.26+t*0.7))))*(1.0-t)*uPulse; float hot=(1.0-smoothstep(0.0,0.045,abs(r-0.62)))*vHot*0.75; a=max(max(core,max(glow,ring*0.85)),hot); col=vColor+core*0.3+hot*0.25; }'+
   ' else if(uShape==1){ float ring=1.0-smoothstep(0.06,0.12,abs(r-0.46)); float dot=1.0-smoothstep(0.10,0.17,r); float glow=exp(-r*r*3.0)*0.18; a=max(max(ring,dot*0.95),glow); }'+
   ' else if(uShape==3){ vec2 q=vec2(d.x,-d.y+0.18); float k=1.7320508; q.x=abs(q.x)-0.62; q.y=q.y+0.62/k; if(q.x+k*q.y>0.0) q=vec2(q.x-k*q.y,-k*q.x-q.y)/2.0; q.x-=clamp(q.x,-1.24,0.0); float sd=-length(q)*sign(q.y);'+
   ' float fillA=1.0-smoothstep(-0.02,0.04,sd); float edge=1.0-smoothstep(0.0,0.07,abs(sd+0.06)); float t=fract(uTime*0.55+vPhase); float ring=(1.0-smoothstep(0.0,0.07,abs(r-(0.32+t*0.62))))*(1.0-t)*uPulse*vHot; a=max(max(fillA*0.6,edge),ring*0.8); col=vColor+edge*0.22; }'+
   ' else { float dm=abs(d.x)+abs(d.y); float shape=1.0-smoothstep(0.50,0.60,dm); float inner=1.0-smoothstep(0.22,0.30,dm); float blink=0.75+0.25*sin(uTime*2.0+vPhase*6.28)*uPulse; a=(shape-inner*0.55)*blink; col=vColor+inner*0.25; }'+
   ' a*=face; if(a<0.02) discard; gl_FragColor=vec4(col,a); }';

  function makePins(recs, shape, colorFn, sizeFn){
    var n = recs.length, pos = new Float32Array(n*3), col = new Float32Array(n*3), size = new Float32Array(n), phase = new Float32Array(n), hot = new Float32Array(n), v = new T.Vector3();
    for(var i=0;i<n;i++){ toVec(recs[i].lat, recs[i].lon, R*1.02, v); pos[i*3]=v.x; pos[i*3+1]=v.y; pos[i*3+2]=v.z; size[i]=sizeFn(recs[i]); phase[i]=(i*0.173)%1; }
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(pos,3));
    g.setAttribute('aColor', new T.BufferAttribute(col,3));
    g.setAttribute('aSize', new T.BufferAttribute(size,1));
    g.setAttribute('aPhase', new T.BufferAttribute(phase,1));
    g.setAttribute('aHot', new T.BufferAttribute(hot,1));
    var m = new T.ShaderMaterial({ uniforms:{uTime:{value:0}, uPulse:{value:reduceMotion?0:1}, uShape:{value:shape}, uPR:{value:renderer.getPixelRatio()}}, vertexShader:PIN_VS, fragmentShader:PIN_FS, transparent:true, depthWrite:false });
    var p = new T.Points(g, m);

}

/* site/data/{market,headlines,status}.json are rewritten by updater/update.py (GitHub Actions)
   and fetched here; the render functions below are the same ones the artifact-db snapshots fed. */
var live = { market:null, headlines:null, status:null, disasters:null, dzError:false, offline:false, fetchError:false, everLoaded:false, raw:{}, seenNews:{}, newsExpanded:false };
var NEWS_SHOW = 6, HOT_MS = 24*3600*1000;
var STALE_MS = 10*3600*1000;          /* market/status older than 10 h -> stale */
var NEWS_STALE_MS = 14*3600*1000;     /* headlines are refreshed twice a day */
var POLL_MS = 10*60*1000;
(function(){ var m = /[?&]poll=(\d+)/.exec(location.search); if(m && +m[1] >= 1000) POLL_MS = +m[1]; })(); /* test hook: ?poll=<ms> */
var LIVE_DOCS = ['market', 'headlines', 'status', 'disasters'];   /* disasters failing never marks the prices as failed */
var conflictIndex = {}; conflicts.forEach(function(c, i){ if(c.id) conflictIndex[c.id] = i; });
var TAG_TH = { economy:'เศรษฐกิจ', world:'โลก', thailand:'ไทย', disaster:'ภัยพิบัติ' };

function parseTs(iso){ var t = Date.parse(iso || ''); return isNaN(t) ? null : t; }
function relTh(iso){
  var t = parseTs(iso); if(t==null) return '';
  var m = Math.round((Date.now()-t)/60000);
  if(m < 1) return 'เมื่อสักครู่';
  if(m < 60) return m + ' นาทีที่แล้ว';
  var hh = Math.floor(m/60); if(hh < 48) return hh + ' ชม. ที่แล้ว';
  return Math.floor(hh/24) + ' วันที่แล้ว';
}
/* Bangkok wall-clock time (UTC+7, no DST), Buddhist-era year */
function bkkDateTime(iso){
  var t = parseTs(iso); if(t==null) return '—';
  var d = new Date(t + 7*3600000);
  return d.getUTCDate() + ' ' + TH_MONTHS[d.getUTCMonth()] + ' ' + (d.getUTCFullYear()+543) + ' ' + ('0'+d.getUTCHours()).slice(-2) + ':' + ('0'+d.getUTCMinutes()).slice(-2) + ' น.';
}
function isStale(iso, ms){ var t = parseTs(iso); return t==null || Date.now()-t > (ms || STALE_MS); }

    cEl.textContent = (tr==='up'?'▲ ':tr==='down'?'▼ ':'') + chg; cEl.className = 'tk-c ' + tr; cEl.title = chg;
    if(changed) flash(el);
  });
  Object.keys(tickerEls).forEach(function(k){ if(!keep[k]){ strip.removeChild(tickerEls[k]); delete tickerEls[k]; } });
  goldLive(items);
  if(!items.length && !strip.querySelector('.live-wait')) strip.appendChild(h('div', {class:'live-wait', text:'ยังไม่มีรายการราคา'}));
  else if(items.length){ var w = strip.querySelector('.live-wait'); if(w) strip.removeChild(w); }
  updateHeaderFlag();
}

/* ================= disasters (data/disasters.json from updater/disasters.py: GDACS + USGS, no AI) ================= */
var DZ_STALE_MS = 10*3600*1000;       /* refreshed every 4 h by the workflow */
var DZ_TYPE_TH = {earthquake:'แผ่นดินไหว', cyclone:'พายุหมุนเขตร้อน', flood:'น้ำท่วม', volcano:'ภูเขาไฟ', wildfire:'ไฟป่า', drought:'ภัยแล้ง'};

var DZ_ICON = {
  earthquake:'<svg viewBox="0 0 16 16"><path d="M1 8.5h2.6l1.6-4 2.6 8 2-6 1.3 2H15"/></svg>',

  flood:'<svg viewBox="0 0 16 16"><path d="M1 6.5c1.4-1.4 2.6-1.4 4 0s2.6 1.4 4 0 2.6-1.4 4 0 1.3 1 2 .6M1 11c1.4-1.4 2.6-1.4 4 0s2.6 1.4 4 0 2.6-1.4 4 0 1.3 1 2 .6"/></svg>',
  volcano:'<svg viewBox="0 0 16 16"><path d="M1.5 14.5 6 7h4l4.5 7.5zM6.6 4.6 5.6 2.5M8 4V1.5M9.4 4.6l1-2.1"/></svg>',
  wildfire:'<svg viewBox="0 0 16 16"><path d="M8 1.5c.6 2.6 3.8 3.8 3.8 7.6A3.8 3.8 0 0 1 4.2 9.1c0-1.7.8-2.8 1.8-3.6.1 1.6.9 2.5 1.8 2.6C7.4 5.6 7.2 3.6 8 1.5z"/></svg>',
  drought:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>'
};
function dzAlert(a){ return DZ_ALERT_TH[a] ? a : 'none'; }
function dzAlertText(a){ return DZ_ALERT_TH[a] ? ('เตือนระดับ' + DZ_ALERT_TH[a]) : 'ไม่มีระดับเตือน'; }
function dzIcon(type, alert){ return h('span', {class:'dz-ic al-' + dzAlert(alert), 'aria-hidden':'true', title:DZ_TYPE_TH[type] || '', html:DZ_ICON[type] || DZ_ICON.earthquake}); }
function dzSources(it){ return it ? [it.source_url, it.alt_source_url].filter(function(u){ return typeof u==='string' && /^https:\/\//.test(u); }) : []; }
/* only well-formed records; red, orange, yellow, green, none; then newest start */
function dzItems(){
  var d = live.disasters, arr = (d && Array.isArray(d.items)) ? d.items : [];
  return arr.filter(function(x){ return x && typeof x==='object' && x.title_th && typeof x.lat==='number' && typeof x.lon==='number' && isFinite(x.lat) && isFinite(x.lon); })
    .map(function(x, i){ return {x:x, i:i}; })
    .sort(function(a, b){ var ra = a.x.alert_level in DZ_RANK ? DZ_RANK[a.x.alert_level] : 4, rb = b.x.alert_level in DZ_RANK ? DZ_RANK[b.x.alert_level] : 4; return ra - rb || (parseTs(b.x.start)||0) - (parseTs(a.x.start)||0) || a.i - b.i; })
    .map(function(o){ return o.x; });
}
/* time ago: quakes and eruptions from their start; long events from the start while recent, else since <date> */
function dzWhen(it){
  var t = parseTs(it.start); if(t==null) return null;
  var instant = it.type==='earthquake' || it.type==='volcano';
  if(instant) return h('span', {'data-rel':String(it.start), title:String(it.start), text:relTh(it.start)});
  if(Date.now()-t < 14*86400000) return h('span', {title:String(it.start)}, ['เริ่ม ', h('span', {'data-rel':String(it.start), text:relTh(it.start)})]);
  return h('span', {title:String(it.start), text:'ตั้งแต่ ' + thaiDate(it.start)});
}
function dzRow(it, i){

function fmtLatLon(lat, lon){ return Math.abs(lat).toFixed(2) + '°' + (lat>=0 ? 'N' : 'S') + ' ' + Math.abs(lon).toFixed(2) + '°' + (lon>=0 ? 'E' : 'W'); }
function renderDisasterDetail(d, it){

  if(isFinite(it.lat) && isFinite(it.lon)) rows.push(kv('พิกัด', fmtLatLon(+it.lat, +it.lon)));
  d.appendChild(h('div', {class:'kv'}, rows));

    ? 'ระดับเตือน PAGER ของ USGS ประเมินจากจำนวนผู้เสียชีวิตและความเสียหายทางเศรษฐกิจที่คาดว่าจะเกิด'
    : 'ระดับเตือนของ GDACS ประเมินผลกระทบด้านมนุษยธรรม: แดง = สูง อาจต้องการความช่วยเหลือระหว่างประเทศ · ส้ม = ปานกลาง · เขียว = ต่ำ'}));
}
function updateDzNote(){
  var head = $('dz-head'); if(!head) return;
  var note = head.querySelector('.note'), doc = live.disasters, n = null;
  var stale = !!(doc && isStale(doc.updated, DZ_STALE_MS));
  if(doc && doc.ok === false && doc.message_th) n = {text:String(doc.message_th), warn:true};
  else if(doc && live.dzError) n = {text:'โหลดข้อมูลภัยพิบัติรอบล่าสุดไม่สำเร็จ แสดงรายการล่าสุดที่ได้รับ', warn:true};
  else if(stale) n = {text:'ข้อมูลภัยพิบัติเก่ากว่า 10 ชม. ระบบอัปเดตอัตโนมัติอาจหยุดทำงาน', warn:true};
  note.hidden = !n; note.textContent = n ? n.text : ''; note.classList.toggle('warn', !!(n && n.warn));

function renderDisasterNews(){

  });
  var go = function(){ showTab('disasters'); clearSelection(); if(isMobile() && sheetState==='low') setSheet('mid'); };
  var box = h('div', {class:'dz-sum', role:'button', tabindex:'0', onclick:go, onkeydown:function(ev){ if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); go(); } }}, [
    h('div', {class:'k'}, [h('span', {class:'tri'}), 'ภัยพิบัติขณะนี้', h('span', {class:'cnt', text:disasters.length + ' เหตุการณ์' + (nRed ? ' · เตือนแดง ' + nRed : '') + (nOr ? ' · ส้ม ' + nOr : '')})]),
    ul,
    h('div', {class:'more', text:'ดูทั้งหมดในแท็บภัยพิบัติ →'})
  ]);

function renderDisasters(){
  var v = $('view-disasters'); if(!v) return;

  var age = h('span', {class:'age'}, stamp ? [h('span', {class:'sdot ' + freshClass(stamp, DZ_STALE_MS), 'data-dzdot':stamp}), h('span', {'data-age':stamp, text:ageText(stamp)})] : []);
  v.appendChild(h('div', {class:'live-head', id:'dz-head'}, [h('h3', {class:'sec-title', text:'ภัยพิบัติขณะนี้'}), age, h('span', {class:'note', hidden:''})]));

/* fetch one doc; resolves to {name, text, data} or {name, error} */
function fetchDoc(name){
  var url = 'data/' + name + '.json?t=' + Math.floor(Date.now()/60000);
  return fetch(url, {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function(text){
    var data = JSON.parse(text);
    if(!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('not an object');
    return {name:name, text:text, data:data};
  }).catch(function(err){ return {name:name, error:String(err && err.message || err)}; });
}
var polling = false, lastPoll = 0;
function pollLive(){
  if(polling || typeof fetch !== 'function') { if(typeof fetch !== 'function') renderOffline(); return Promise.resolve(); }
  polling = true; lastPoll = Date.now();
  return Promise.all(LIVE_DOCS.map(fetchDoc)).then(function(res){
    var changed = {}, failed = 0;
    var dzHadError = live.dzError;
    res.forEach(function(r){
      if(r.name==='disasters') live.dzError = !!r.error;
      if(r.error){ if(r.name!=='disasters') failed++; return; }
      if(live.raw[r.name] !== r.text){ live.raw[r.name] = r.text; live[r.name] = r.data; changed[r.name] = true; }
    });
    var marketOk = !!live.market;
    if(!marketOk){ live.fetchError = false; if(!live.offline) renderOffline(); }
    else {
      var wasOffline = live.offline, hadError = live.fetchError;
      live.offline = false; live.everLoaded = true;
      live.fetchError = failed > 0;
      if(wasOffline || changed.market || changed.status || hadError !== live.fetchError) renderTicker();
      else updateStaleNote();
    }
    if(changed.headlines){ renderNews(); updateCardLatest(); updateHot(); }
    if(changed.disasters || dzHadError !== live.dzError || (live.dzError && !live.disasters)) renderDisasters();
    else if(changed.headlines) renderDisasterNews();
    window.__liveState = {offline:live.offline, fetchError:live.fetchError, polls:(window.__liveState ? window.__liveState.polls : 0) + 1, failed:failed};
  }).then(function(){ polling = false; }, function(){ polling = false; });
}
(function initLive(){
  renderDisasters();
  pollLive();
  setInterval(function(){ if(!document.hidden) pollLive(); }, POLL_MS);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && Date.now()-lastPoll > 2000) pollLive(); });
  window.addEventListener('online', function(){ pollLive(); });
})();
})();
