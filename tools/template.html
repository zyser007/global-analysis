  var d0 = bkkDay(a), d1 = (b!=null && b>a) ? bkkDay(b) : d0;
  if(d1 !== d0) return h('span', {class:'rd-dz-date', text:thaiDate(d0) + ' – ' + thaiDate(d1)});
  return h('span', {class:'rd-dz-date'}, [thaiDate(d0) + ' (', h('span', {'data-rel':String(it.start), text:relTh(it.start)}), ')']);
}
function rdDisasters(N){
  var s = rdSection('r-disasters', 'ภัยพิบัติล่าสุด'), doc = live.disasters;
  if(doc) s.appendChild(rdAge(doc.updated));
  if(N.dz) s.appendChild(rdNote(N.dz));
  if(doc && !disasters.length) s.appendChild(h('p', {text:DZ_EMPTY_TH}));
  if(disasters.length) s.appendChild(h('ul', {class:'rd-rows', id:'r-dz-list'}, disasters.map(function(it){
    var src = dzSources(it);
    return h('li', {class:'rd-dz', 'data-id':String(it.id || '')}, [
      h('h3', {text:String(it.title_th)}),
      h('p', {class:'rd-level'}, [h('b', {text:dzAlertText(it.alert_level)}), DZ_TYPE_TH[it.type] ? ' · ' + DZ_TYPE_TH[it.type] : '', it.country_th ? ' · ' + String(it.country_th) : '']),
      it.severity_th ? h('p', {class:'rd-sev', text:String(it.severity_th)}) : null,
      h('div', {class:'rd-meta'}, [rdDzDate(it)].concat(src.map(function(u, j){ var nm = j===0 ? it.source_name : it.alt_source_name; return rdA(u, nm ? String(nm) : domain(u)); })))
    ]);
  })));
  s.appendChild(dzSrcNote('rd-note'));
}
function rdEconomy(N){
  var s = rdSection('r-economy', 'เศรษฐกิจและช่องแคบ');
  s.appendChild(rdBasisLine());
  if(N.basis) s.appendChild(rdNote(N.basis));
  if(economies.length) s.appendChild(rdMore('econ', 'เศรษฐกิจรายประเทศ (' + economies.length + ')', 'rd-group', [h('ul', {class:'rd-rows', id:'r-econ-list'}, economies.map(function(e){
    return h('li', null, [rdMore('econ-' + (e.iso || e.name_th), h('span', null, [
      h('span', {class:'nm'}, [String(e.name_th) + ' · ', h('b', {text:HEALTH_TH[e.health] || '—'})]),
      h('span', {class:'st', text:'GDP 2026 ' + pct(e.gdp_growth_2026) + ' · GDP 2027 (คาดการณ์) ' + pct(e.gdp_growth_2027) + ' · เงินเฟ้อ ' + num(e.inflation, '%') + ' · ดอกเบี้ยนโยบาย ' + num(e.policy_rate, '%')})
    ]), 'rd-item', [e.note_th ? h('p', {text:String(e.note_th)}) : null, rdSources(e.sources)])]);
  }))]));
  if(chokepoints.length) s.appendChild(rdMore('choke', 'ช่องแคบและเส้นทางการค้า (' + chokepoints.length + ')', 'rd-group', [h('ul', {class:'rd-rows', id:'r-choke-list'}, chokepoints.map(function(c){
    return h('li', null, [
      h('p', {class:'rd-title'}, [h('b', {text:String(c.name_th)})]),
      h('p', {class:'rd-level'}, [h('b', {text:LEVEL_TH[c.level] || '—'}), ' · ระดับ ' + (c.level || 1) + ' จาก 3']),
      c.note_th ? h('p', {text:String(c.note_th)}) : null,
      rdSources(c.sources)
    ]);
  }))]));
}
function rdGold(N){
  var s = rdSection('r-gold', 'ทองคำ'), vm = N.vm;
  if(!GOLD || !vm){ s.hidden = true; return; }
  var g = GOLD, th = g.thai || {}, sl = rdGoldItem(goldState.live), tl = rdGoldItem(goldState.liveTh);
  if(N.gold) s.appendChild(rdNote(N.gold));
  var old = function(x){ return x.live ? '' : ' (ค่า ' + GOLD_THAI_SHORT + ')'; };
  var rows = [];
  if(tl || th.sell != null) rows.push(h('li', {class:'rd-price rd-gold', id:'r-gold-th'}, [
    h('div', {class:'top'}, [h('span', {class:'nm', text:'ทองคำแท่งไทย ขายออก'}), h('span', {class:'val'}, [tl ? rdGroupedNum(tl.value) : fmtN(th.sell), h('span', {class:'u', text:'บาท'})])]),
    vm.buy && vm.buy.v != null ? h('div', {class:'chg', text:'รับซื้อ ' + fmtN(vm.buy.v) + ' บาท' + old(vm.buy)}) : null,
    vm.orn && vm.orn.v != null ? h('div', {class:'chg', text:'ทองรูปพรรณ ขายออก ' + fmtN(vm.orn.v) + ' บาท' + old(vm.orn)}) : null,
    tl && tl.change_th ? h('div', {class:'chg'}, [rdGlyph(tl.trend), String(tl.change_th)]) : null,
    h('div', {class:'rd-meta'}, [tl ? rdRel(tl.as_of, 'ณ ') : h('span', {text:'ณ ' + thaiDateTime(th.as_of)}), tl && tl.source ? rdA(tl.source) : (th.source_th ? h('span', {text:String(th.source_th)}) : null)])
  ]));
  if(sl || g.spot_now != null) rows.push(h('li', {class:'rd-price rd-gold', id:'r-gold-spot'}, [
    h('div', {class:'top'}, [h('span', {class:'nm', text:'ทองคำโลก (spot)'}), h('span', {class:'val'}, sl ? [rdGroupedNum(sl.value), sl.unit ? h('span', {class:'u', text:String(sl.unit)}) : null] : ['$' + fmtN(g.spot_now), h('span', {class:'u', text:'ต่อออนซ์'})])]),
    sl && sl.change_th ? h('div', {class:'chg'}, [rdGlyph(sl.trend), String(sl.change_th)]) : null,
    h('div', {class:'rd-meta'}, [sl ? rdRel(sl.as_of, 'ณ ') : h('span', {text:'ณ ' + thaiDateTime(g.as_of)}), sl && sl.source ? rdA(sl.source) : null])
  ]));
  s.appendChild(h('ul', {class:'rd-rows'}, rows));
  if(g.disclaimer_th) s.appendChild(h('p', {class:'rd-note', text:String(g.disclaimer_th)}));
}
function rdBanner(N){
  var b = $('r-banner'), parts = [];
  if(live.offline){ b.textContent = offlineText(); b.hidden = false; return; }
  [[N.news, 'ข่าว'], [N.price, 'ราคา'], [N.basis, 'ความขัดแย้งและเศรษฐกิจ'], [N.dz, 'ภัยพิบัติ'], [N.gold, 'ทองคำ']].forEach(function(p){ if(p[0] && p[0].warn) parts.push(p[1]); });
  b.hidden = !parts.length;
  b.textContent = parts.length ? 'ข้อมูลบางส่วนอาจไม่เป็นปัจจุบัน: ' + parts.join(' · ') + ' ดูข้อควรระวังในแต่ละหัวข้อ' : '';
}
/* re-render only when the data or a warning changed; open sections stay open (rdOpen). Hidden while the map view is on. */
function rdRefresh(force){
  if(force) rdDirty = true;
  if(viewMode !== 'read') return;
  var N = rdNotes(), sig = JSON.stringify([N.basis, N.price, N.news, N.dz, N.gold, live.offline]);
  if(!rdDirty && sig === rdSig) return;
  rdSig = sig; rdDirty = false;
  rdBanner(N); rdLatest(N); rdPrices(N); rdConflicts(N); rdDisasters(N); rdEconomy(N); rdGold(N);
}
(function initReader(){
  var r = $('reader');
  r.addEventListener('toggle', function(ev){ var k = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-rd'); if(k) rdOpen[k] = ev.target.open; }, true);
  $('r-to-map').addEventListener('click', function(){ setView('map'); });
})();

/* ================= view switch ================= */
function paintViewSwitch(){
  $('vw-read').setAttribute('aria-pressed', String(viewMode === 'read'));
  $('vw-map').setAttribute('aria-pressed', String(viewMode === 'map'));
}
function setView(v){
  var same = v === viewMode;
  viewMode = v;
  document.documentElement.setAttribute('data-view', v);
  paintViewSwitch();
  try { localStorage.setItem('world-view', v); } catch(e){}
  /* the address always names the view on screen: it can be shared, and a reload keeps it */
  try {
    var q = new URLSearchParams(location.search); q.set('view', v);
    history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash);
  } catch(e){}
  if(same) return;
  window.scrollTo(0, 0);
  if(v === 'map'){ startGlobe(); if(currentTab === 'gold') goldLayout(); }
  else rdRefresh(false);
}
$('vw-read').addEventListener('click', function(){ setView('read'); });
$('vw-map').addEventListener('click', function(){ setView('map'); });
paintViewSwitch();

/* fetch one doc; resolves to {name, text, data} or {name, error} */
function fetchDoc(name){
  var url = 'data/' + name + '.json?t=' + Math.floor(Date.now()/60000);
  return fetch(url, {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function(text){
    var data = JSON.parse(text);
    if(!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('not an object');
    return {name:name, text:text, data:data};
  }).catch(function(err){ return {name:name, error:String(err && err.message || err)}; });
}
var polling = false, lastPoll = 0;
function pollLive(){
  if(polling || typeof fetch !== 'function') { if(typeof fetch !== 'function') renderOffline(); return Promise.resolve(); }
  polling = true; lastPoll = Date.now();
  return Promise.all(LIVE_DOCS.map(fetchDoc)).then(function(res){
    var changed = {}, failed = 0;
    var dzHadError = live.dzError;
    res.forEach(function(r){
      if(r.name==='disasters') live.dzError = !!r.error;
      live.docErr[r.name] = !!r.error;
      if(r.error){ if(!SIDE_DOCS[r.name]) failed++; return; }
      if(live.raw[r.name] !== r.text){ live.raw[r.name] = r.text; live[r.name] = r.data; changed[r.name] = true; }
    });
    var marketOk = !!live.market;
    if(!marketOk){ live.fetchError = false; if(!live.offline) renderOffline(); }
    else {
      var wasOffline = live.offline, hadError = live.fetchError;
      live.offline = false; live.everLoaded = true;
      live.fetchError = failed > 0;
      if(wasOffline || changed.market || changed.status || hadError !== live.fetchError) renderTicker();
      else updateStaleNote();
    }
    if(changed.headlines){ renderNews(); updateCardLatest(); updateHot(); }
    if(changed.gold_history) goldHistory(live.gold_history);
    if(changed.disasters || dzHadError !== live.dzError || (live.dzError && !live.disasters)) renderDisasters();
    else if(changed.headlines) renderDisasterNews();
    live.polled = true;
    rdRefresh(Object.keys(changed).length > 0);
    window.__liveState = {offline:live.offline, fetchError:live.fetchError, polls:(window.__liveState ? window.__liveState.polls : 0) + 1, failed:failed};
  }).then(function(){ polling = false; }, function(){ polling = false; });
}
(function initLive(){
  renderDisasters();
  rdRefresh(true);
  if(viewMode === 'map') startGlobe();
  pollLive();
  setInterval(function(){ if(!document.hidden) pollLive(); }, POLL_MS);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && Date.now()-lastPoll > 2000) pollLive(); });
  window.addEventListener('online', function(){ pollLive(); });
})();
})();
</script>
