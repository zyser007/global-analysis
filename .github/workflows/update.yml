name: Update live data

on:
  # Cron is UTC. prices = every hour at minute 7 (free direct feeds, no AI, updater/prices.py);
  # full = 08:00 / 20:00 Bangkok: the prices first, then headlines + run summary with Claude (updater/update.py full).
  # GitHub may start a scheduled run several minutes late; that is fine.
  schedule:
    - cron: "0 1,13 * * *"        # full
    - cron: "7 * * * *"           # prices
  workflow_dispatch:
    inputs:
      mode:
        description: "prices = ราคา 13 รายการจากแหล่งข้อมูลฟรีโดยตรง (ไม่ใช้ AI ไม่มีค่าใช้จ่าย) · full = ราคา + ข่าว + สถานะ (ค้นเว็บ ≤ 14 ครั้ง)"
        type: choice
        options: [prices, full]
        default: prices

permissions:
  contents: write

concurrency:
  group: live-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: updater/requirements.txt

      - name: Install updater dependencies
        run: python -m pip install -r updater/requirements.txt

      - name: Pick the mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then mode="$INPUT_MODE"
          elif [ "$SCHEDULE" = "0 1,13 * * *" ]; then mode=full
          else mode=prices; fi
          case "$mode" in prices|full) ;; *) echo "unknown mode: $mode"; exit 1;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode: $mode"

      # Free GDACS + USGS feeds, no AI and no key. Runs every hour and never blocks the price or news update
      # (or is blocked by it): a failed feed keeps its previous events and says so in disasters.json.
      - name: Refresh disasters (GDACS + USGS)
        id: disasters
        continue-on-error: true
        timeout-minutes: 3
        run: python -I updater/disasters.py

      # Free GDACS tropical cyclone tracks, no AI and no key, for the page's storm and rain layer. Same rules as disasters:
      # a failure keeps the last good file and says so, and never blocks prices, news or disasters.
      - name: Refresh storm tracks (GDACS)
        id: storms
        continue-on-error: true
        timeout-minutes: 3
        run: python -I updater/storms.py

      - name: Check the current data files
        id: check
        continue-on-error: true   # a broken market/headlines/status file must not stop the disasters commit
        run: python -I updater/update.py --dry-run

      # Free direct quote feeds (CNBC, Cboe, Nikkei Indexes, Gold Traders Association, CoinGecko, Yahoo, US Treasury ...),
      # no AI and no key. A key whose feeds all fail keeps its previous value; more than 6 failed keys = ok=false.
      - name: Refresh prices (direct feeds)
        id: prices
        if: steps.check.outcome == 'success'
        continue-on-error: true   # a failed run still writes status.json (ok=false); commit it, then fail the job
        timeout-minutes: 5
        run: python -I updater/prices.py

      - name: Refresh headlines with Claude
        id: run
        if: steps.mode.outputs.mode == 'full' && steps.check.outcome == 'success'
        continue-on-error: true   # a failed run still writes status.json (ok=false); commit it, then fail the job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -I updater/update.py full

      - name: Commit changed data
        id: commit
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/data/market.json site/data/headlines.json site/data/status.json updater/cost-log.csv
          if [ -f site/data/disasters.json ]; then git add site/data/disasters.json; fi
          if [ -f site/data/storms.json ]; then git add site/data/storms.json; fi
          if [ -f site/data/gold_history.json ]; then git add site/data/gold_history.json; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "no data changes"
            exit 0
          fi
          # only a change under site/ needs a Pages deploy (the cost log is not published)
          if git diff --cached --quiet -- site/; then deploy=false; else deploy=true; fi
          git commit -m "chore(data): ${MODE} update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase origin main
            if [ "$i" = 3 ]; then exit 1; fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Fail the job if a step failed
        if: steps.check.outcome == 'failure' || steps.prices.outcome == 'failure' || steps.run.outcome == 'failure' || steps.disasters.outcome == 'failure' || steps.storms.outcome == 'failure'
        env:
          CHECK: ${{ steps.check.outcome }}
          PRICES: ${{ steps.prices.outcome }}
          RUN: ${{ steps.run.outcome }}
          DISASTERS: ${{ steps.disasters.outcome }}
          STORMS: ${{ steps.storms.outcome }}
        run: |
          if [ "$CHECK" = "failure" ]; then echo "::error::the current market/headlines/status files are invalid - the price and news updates were skipped. See the dry-run log above."; fi
          if [ "$PRICES" = "failure" ]; then echo "::error::prices.py failed (more than 6 keys without a feed, or a timeout) - the old prices were kept and status.json says ok=false. See the log above."; fi
          if [ "$RUN" = "failure" ]; then echo "::error::update.py full failed - the old headlines were kept and status.json says ok=false. See the log above."; fi
          if [ "$DISASTERS" = "failure" ]; then echo "::error::disasters.py could not read GDACS or USGS - the previous disasters.json was kept (ok=false). See the log above."; fi
          if [ "$STORMS" = "failure" ]; then echo "::error::storms.py could not read GDACS - the previous storms.json was kept (ok=false). See the log above."; fi
          exit 1

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy Pages from here.
  deploy:
    needs: update
    if: always() && needs.update.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
