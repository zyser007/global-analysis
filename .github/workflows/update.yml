name: Update live data

on:
  # Cron is UTC. full = 08:00 / 20:00 Bangkok, prices = 12:00 / 16:00 / 00:00 / 04:00 Bangkok.
  # เปิดหลังรันทดลองผ่าน: ลบ # หน้า 3 บรรทัดด้านล่าง (schedule และ cron 2 บรรทัด)เมื่อรันทดลองด้วยมือ (workflow_dispatch) ผ่านแล้ว
  # schedule:
  #   - cron: "0 1,13 * * *"        # full
  #   - cron: "0 5,9,17,21 * * *"   # prices
  workflow_dispatch:
    inputs:
      mode:
        description: "prices = ราคาอย่างเดียว (ค้นเว็บ ≤ 6 ครั้ง) · full = ราคา + ข่าว + สถานะ (ค้นเว็บ ≤ 20 ครั้ง)"
        type: choice
        options: [prices, full]
        default: prices

permissions:
  contents: write

concurrency:
  group: live-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: updater/requirements.txt

      - name: Install updater dependencies
        run: python -m pip install -r updater/requirements.txt

      - name: Pick the mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then mode="$INPUT_MODE"
          elif [ "$SCHEDULE" = "0 1,13 * * *" ]; then mode=full
          else mode=prices; fi
          case "$mode" in prices|full) ;; *) echo "unknown mode: $mode"; exit 1;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode: $mode"

      - name: Check the current data files
        run: python -I updater/update.py --dry-run

      - name: Run the updater
        id: run
        continue-on-error: true   # a failed run still writes status.json (ok=false); commit it, then fail the job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: python -I updater/update.py "$MODE"

      - name: Commit changed data
        id: commit
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/data/market.json site/data/headlines.json site/data/status.json updater/cost-log.csv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no data changes"
            exit 0
          fi
          git commit -m "chore(data): ${MODE} update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase origin main
            if [ "$i" = 3 ]; then exit 1; fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Fail the job if the update failed
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::update.py failed - the old prices and headlines were kept and status.json says ok=false. See the log above."
          exit 1

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy Pages from here.
  deploy:
    needs: update
    if: always() && needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
